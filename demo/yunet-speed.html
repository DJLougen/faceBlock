<!doctype html><html><head><meta charset="utf-8"><title>YuNet speed</title>
<style>body{font:13px ui-monospace,monospace;background:#11151b;color:#e6edf3;padding:24px;white-space:pre-wrap}</style></head>
<body><pre id="out">running…</pre><script type="module">
import * as ort from "onnxruntime-web/wasm";
const log = (s) => { document.querySelector("#out").textContent += "\n" + s; };
ort.env.wasm.wasmPaths = "/ort/"; ort.env.wasm.proxy = false; ort.env.wasm.numThreads = 1;

async function pass(session, img, size, reps) {
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  const plane = size * size;
  const chw = new Float32Array(3 * plane);
  const times = [];
  for (let r = 0; r < reps; r++) {
    const t0 = performance.now();
    ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, size, size);
    const { data } = ctx.getImageData(0, 0, size, size);
    const tRead = performance.now();
    for (let i = 0; i < plane; i++) {
      const o = i * 4;
      chw[i] = data[o + 2]; chw[plane + i] = data[o + 1]; chw[2 * plane + i] = data[o];
    }
    const tPack = performance.now();
    await session.run({ [session.inputNames[0]]: new ort.Tensor("float32", chw, [1, 3, size, size]) });
    const tEnd = performance.now();
    times.push({ read: Math.round(tRead - t0), pack: Math.round(tPack - tRead), infer: Math.round(tEnd - tPack), total: Math.round(tEnd - t0) });
  }
  const med = (k) => { const a = times.map(t => t[k]).sort((x, y) => x - y); return a[Math.floor(a.length / 2)]; };
  return `read=${med("read")}ms pack=${med("pack")}ms infer=${med("infer")}ms TOTAL=${med("total")}ms`;
}

try {
  const session = await ort.InferenceSession.create("/models/face_detection_yunet_2026may.onnx", { executionProviders: ["wasm"] });
  for (const [label, url] of [["460x460 theo.jpg", "/samples/theo.jpg"], ["2400x2400 large", "/perf-large.jpg"]]) {
    const img = new Image(); img.src = url; await img.decode();
    log(`\n${label} (${img.naturalWidth}x${img.naturalHeight})`);
    for (const size of [320, 640]) log(`  ${size}px: ${await pass(session, img, size, 5)}`);
  }
} catch (e) { log("THREW: " + e.message); }
document.querySelector("#out").textContent += "\n\nDONE";
</script></body></html>
