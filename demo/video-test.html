<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FaceBlock video test</title>
<style>
  body{font:17px system-ui;max-width:1100px;margin:40px auto;padding:0 24px;background:#11151b;color:#edf1f5}
  .row{display:flex;gap:24px;flex-wrap:wrap}
  figure{margin:0}
  video,img{display:block;width:360px;height:360px;object-fit:cover;border-radius:8px;background:#000}
  figcaption{padding:10px 0;color:#b9c4d0}
  p{line-height:1.5;color:#b9c4d0}
</style>
</head>
<body>
  <h1>FaceBlock video test</h1>
  <p>An ordinary page playing a video of a blocked person. Video recognition is deliberately
     low-rate; masks are coasted between recognitions, so they should follow the face at full
     video rate rather than flickering.</p>
  <div class="row">
    <figure>
      <video id="clip" src="/video-theo.mp4" autoplay muted loop playsinline></video>
      <figcaption>Moving face — expected to be masked</figcaption>
    </figure>
    <figure>
      <img src="/samples/unrelated.jpg" alt="unrelated">
      <figcaption>Control — must stay visible</figcaption>
    </figure>
  </div>
</body>
</html>
