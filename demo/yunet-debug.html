<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YuNet debug</title>
<style>body{font:13px ui-monospace,monospace;background:#11151b;color:#e6edf3;padding:24px;white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
import * as ort from "onnxruntime-web/wasm";
const log = (s) => { document.querySelector("#out").textContent += "\n" + s; };
ort.env.wasm.wasmPaths = "/ort/";
ort.env.wasm.proxy = false;
ort.env.wasm.numThreads = 1;

const S = 640;
const STRIDES = [8, 16, 32];

function nms(faces, thr) {
  const s = [...faces].sort((a, b) => b.score - a.score);
  const keep = [];
  for (const f of s) {
    let dup = false;
    for (const k of keep) {
      const x1 = Math.max(k.box.x, f.box.x), y1 = Math.max(k.box.y, f.box.y);
      const x2 = Math.min(k.box.x + k.box.w, f.box.x + f.box.w);
      const y2 = Math.min(k.box.y + k.box.h, f.box.y + f.box.h);
      if (x2 <= x1 || y2 <= y1) continue;
      const inter = (x2 - x1) * (y2 - y1);
      const union = k.box.w * k.box.h + f.box.w * f.box.h - inter;
      if (union > 0 && inter / union > thr) { dup = true; break; }
    }
    if (!dup) keep.push(f);
  }
  return keep;
}

function decode(out, thr) {
  const faces = [];
  for (const stride of STRIDES) {
    const cls = out[`cls_${stride}`]?.data, obj = out[`obj_${stride}`]?.data, bbox = out[`bbox_${stride}`]?.data;
    if (!cls || !obj || !bbox) continue;
    const side = Math.floor(S / stride);
    for (let r = 0; r < side; r++) for (let c = 0; c < side; c++) {
      const cell = r * side + c;
      const score = Math.sqrt(Math.max(0, cls[cell]) * Math.max(0, obj[cell]));
      if (score < thr) continue;
      const b = cell * 4;
      const cx = (c + bbox[b]) * stride, cy = (r + bbox[b + 1]) * stride;
      const w = Math.exp(bbox[b + 2]) * stride, h = Math.exp(bbox[b + 3]) * stride;
      faces.push({ box: { x: cx - w / 2, y: cy - h / 2, w, h }, score });
    }
  }
  return nms(faces, 0.3);
}

async function run(session, img, swapRB) {
  const c = document.createElement("canvas");
  c.width = S; c.height = S;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, S, S);
  const { data } = ctx.getImageData(0, 0, S, S);
  const plane = S * S;
  const chw = new Float32Array(3 * plane);
  for (let i = 0; i < plane; i++) {
    const o = i * 4;
    const r = data[o], g = data[o + 1], b = data[o + 2];
    chw[i] = swapRB ? b : r;
    chw[plane + i] = g;
    chw[2 * plane + i] = swapRB ? r : b;
  }
  const out = await session.run({ [session.inputNames[0]]: new ort.Tensor("float32", chw, [1, 3, S, S]) });
  return decode(out, 0.5);
}

const URLS = [
  ["theo.jpg (single clear face)", "/samples/theo.jpg"],
  ["profile (side view)", "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e9/Donald_Trump_profile.jpg/960px-Donald_Trump_profile.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail"],
  ["crowd (oath ceremony)", "https://upload.wikimedia.org/wikipedia/commons/f/f4/Donald_Trump_taking_his_Oath_of_Office.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled"],
];

try {
  const session = await ort.InferenceSession.create("/models/face_detection_yunet_2023mar.onnx", { executionProviders: ["wasm"] });
  log(`outputs: ${session.outputNames.length}`);
  for (const [label, url] of URLS) {
    let img;
    try {
      img = new Image();
      img.crossOrigin = "anonymous";
      img.src = url;
      await img.decode();
    } catch (e) { log(`\n${label}\n  image failed: ${e.message}`); continue; }
    const rgb = await run(session, img, false);
    const bgr = await run(session, img, true);
    log(`\n${label}  (${img.naturalWidth}x${img.naturalHeight})`);
    log(`  RGB order: ${rgb.length} faces, top score ${rgb[0] ? rgb[0].score.toFixed(3) : "-"}`);
    log(`  BGR order: ${bgr.length} faces, top score ${bgr[0] ? bgr[0].score.toFixed(3) : "-"}`);
  }
} catch (e) {
  log("THREW: " + (e && e.message ? e.message : String(e)));
}
document.querySelector("#out").textContent += "\n\nDONE";
</script>
</body>
</html>
