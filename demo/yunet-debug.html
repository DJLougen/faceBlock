<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YuNet debug</title>
<style>body{font:14px ui-monospace,monospace;background:#11151b;color:#e6edf3;padding:24px;white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
import * as ort from "onnxruntime-web/wasm";

const log = (s) => { document.querySelector("#out").textContent += "\n" + s; };
ort.env.wasm.wasmPaths = "/ort/";
ort.env.wasm.proxy = false;
ort.env.wasm.numThreads = 1;

function stats(t) {
  const d = t.data;
  let min = Infinity, max = -Infinity, neg = 0, pos1 = 0;
  for (let i = 0; i < d.length; i++) {
    const v = d[i];
    if (v < min) min = v;
    if (v > max) max = v;
    if (v < 0) neg++;
    if (v > 1) pos1++;
  }
  return `dims=${JSON.stringify(t.dims)} min=${min.toFixed(3)} max=${max.toFixed(3)} negatives=${neg} over1=${pos1}`;
}

try {
  const session = await ort.InferenceSession.create("/models/face_detection_yunet_2023mar.onnx", { executionProviders: ["wasm"] });
  log("INPUT NAMES : " + JSON.stringify(session.inputNames));
  log("OUTPUT NAMES: " + JSON.stringify(session.outputNames));

  const img = new Image();
  img.src = "/samples/theo.jpg";
  await img.decode();
  const S = 640;
  const c = document.createElement("canvas");
  c.width = S; c.height = S;
  const ctx = c.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, img.naturalWidth, img.naturalHeight, 0, 0, S, S);
  const { data } = ctx.getImageData(0, 0, S, S);
  const plane = S * S;
  const chw = new Float32Array(3 * plane);
  for (let i = 0; i < plane; i++) {
    chw[i] = data[i * 4];
    chw[plane + i] = data[i * 4 + 1];
    chw[2 * plane + i] = data[i * 4 + 2];
  }
  const feeds = {};
  feeds[session.inputNames[0]] = new ort.Tensor("float32", chw, [1, 3, S, S]);
  const out = await session.run(feeds);
  log("\n--- output tensor ranges (cls/obj in [0,1] means sigmoid already applied) ---");
  for (const name of session.outputNames) {
    if (out[name]) log(`  ${name.padEnd(10)} ${stats(out[name])}`);
  }
} catch (e) {
  log("THREW: " + (e && e.message ? e.message : String(e)));
}
document.querySelector("#out").textContent += "\n\nDONE";
</script>
</body>
</html>
