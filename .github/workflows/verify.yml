name: verify

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun test tests
      - run: bun run typecheck
      - run: bun run verify:assets
      - run: bun run package
      # bun run package rebuilds, verifies the built tree, and checks the
      # archive listing fail-closed. The live-Chrome smoke check
      # (bun run verify:browser) is intentionally NOT part of CI — it needs a
      # real browser session and is run manually; it emits JSON diagnostics,
      # not held-out accuracy.
